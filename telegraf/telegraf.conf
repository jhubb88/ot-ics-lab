# =============================================================================
# OT/ICS Security Lab — Telegraf configuration
# =============================================================================
# Telegraf reads the tank-fill PLC over Modbus TCP every 3 seconds and writes
# the readings into InfluxDB. This is the "collector" container in the
# historian stack defined by ADR 0002 (docs/decisions/0002-historian-stack.md).
#
# Register addresses come from docs/architecture.md lines 112-117 and are
# cross-checked against the Suricata SID-9000015 in-map cutoff (HR < 3).
#
# To add a new tag in the future:
#   1. Confirm the PLC's IEC variable maps to which Modbus register
#      (see docs/architecture.md for the canonical map).
#   2. Add a fields entry under the matching request block below.
#   3. Restart only this container: docker compose restart otlab-telegraf
#
# WARNING: silent decode mismatches. If byte_order or type below is wrong,
# Telegraf writes WRONG numbers without raising an error. Validate every
# newly-added field against mbpoll or the FUXA HMI before trusting it.
# (ADR 0002 -> Risks accepted -> Operational gotchas.)
# =============================================================================

[agent]
  # How often Telegraf polls the PLC. Tight enough to see tank-fill cycles,
  # loose enough that one missed poll won't gap the chart.
  interval = "3s"

  # How often Telegraf sends queued metrics to InfluxDB. Higher = fewer HTTP
  # round-trips; lower = data appears in Grafana more quickly.
  flush_interval = "10s"

  # In-memory queue for metrics when InfluxDB is unreachable. Generous so a
  # short InfluxDB outage doesn't drop data. Per ADR 0002 risk note: this
  # buffer is RAM only — a Telegraf restart during an InfluxDB outage loses
  # every metric still queued.
  metric_buffer_limit = 100000

# -----------------------------------------------------------------------------
# Input: OpenPLC v4 over Modbus TCP
# -----------------------------------------------------------------------------
[[inputs.modbus]]
  # Identifies which device produced the readings. Shows up in InfluxDB as
  # a "name" tag on every metric — useful if a second PLC is ever added.
  name = "openplc_v4"

  # Docker DNS name + Modbus TCP port. Resolves on the ot_zone network.
  controller = "tcp://otlab-openplc-v4:502"

  # If the PLC doesn't answer in 2 seconds, give up and try again next interval.
  timeout = "2s"

  # Tag every metric with the measurement name "tank_fill" instead of the
  # default "modbus". Makes the InfluxDB queries readable.
  name_override = "tank_fill"

  # Use the "request" config style: group registers that read together into
  # one Modbus request. Explicit data type / byte order per field — no
  # silent decode guesses by Telegraf.
  configuration_type = "request"

  # --- Holding registers (Modbus FC3 read) ---------------------------------
  # Mapping source: docs/architecture.md lines 112-114.
  #   HR 0 = %QW0  Level_PV     (tank level, 0-100 %)
  #   HR 1 = %QW1  SP_Low_Out   (low setpoint mirror)
  #   HR 2 = %QW2  SP_High_Out  (high setpoint mirror)
  # All three are IEC `int` (16-bit signed) -> Telegraf type INT16.
  # Modbus is big-endian by spec; the Telegraf request-style plugin accepts
  # only 4-character byte_order values (ABCD/DCBA/BADC/CDAB) — ABCD =
  # big-endian Motorola, the Modbus standard. The 4-char form is used even
  # for 16-bit fields (only the first two chars are meaningful then).
  # Source: github.com/influxdata/telegraf/blob/v1.38.4/plugins/inputs/modbus/README.md
  [[inputs.modbus.request]]
    slave_id = 1
    register = "holding"
    byte_order = "ABCD"
    fields = [
      { address = 0, name = "tank_level_pct",    type = "INT16" },
      { address = 1, name = "setpoint_low_pct",  type = "INT16" },
      { address = 2, name = "setpoint_high_pct", type = "INT16" },
    ]

  # --- Coils (Modbus FC1 read) ---------------------------------------------
  # Mapping source: docs/architecture.md lines 115-117.
  #   Coil 0 = %QX0.0  Pump_Run    (pump command, bool)
  #   Coil 1 = %QX0.1  Valve_Open  (inlet valve command, bool)
  #   Coil 2 = %QX0.2  High_Alarm  (high-high alarm, bool)
  # Coils are 1 bit each. Per the Telegraf 1.38 modbus plugin README, the
  # per-field `type` and `byte_order` values are IGNORED for register = "coil"
  # (and "discrete"), so they are omitted here. Source:
  # github.com/influxdata/telegraf/blob/v1.38.4/plugins/inputs/modbus/README.md
  [[inputs.modbus.request]]
    slave_id = 1
    register = "coil"
    fields = [
      { address = 0, name = "pump_run"   },
      { address = 1, name = "valve_open" },
      { address = 2, name = "high_alarm" },
    ]

# -----------------------------------------------------------------------------
# Output: InfluxDB v2
# -----------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  # Docker DNS name + InfluxDB API port. Resolves on the mgmt_zone network.
  urls = ["http://otlab-influxdb:8086"]

  # Authentication for InfluxDB. Pulled from .env at container start.
  token = "${INFLUXDB_INIT_ADMIN_TOKEN}"

  # Which org owns the bucket. Pulled from .env.
  organization = "${INFLUXDB_INIT_ORG}"

  # Which bucket to write data into. Pulled from .env.
  bucket = "${INFLUXDB_INIT_BUCKET}"
