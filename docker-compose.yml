# =============================================================================
# OT/ICS Security Lab — Phase 1 + Phase 2
# 3 services (Phase 1) + 1 attacker (step 1) + 1 Suricata sensor (step 3a).
# 3 networks. Static IPs pinned for openplc + fuxa so the IDS ruleset has
# stable reference addresses.
#
# No top-level `version:` key on purpose — Docker Compose v2 deprecated it.
# WSL2 + Docker Desktop reminder (full detail in README.md):
#   - From the WINDOWS browser:        use  http://localhost:<port>
#   - Container talking to container:  use the SERVICE NAME, never localhost
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # openplc — the PLC. Runs the tank-fill control logic and serves Modbus/TCP.
  # Built from PINNED official upstream source (see plc/Dockerfile for the full
  # supply-chain rationale — that "why" is part of the recruiter story).
  #
  # Phase 2 step 3a — IPs pinned (ipv4_address) so Suricata rules referencing
  # $OPENPLC_IP and $FUXA_IP have stable targets across restarts.
  # ---------------------------------------------------------------------------
  openplc:
    build:
      context: ./plc
      dockerfile: Dockerfile
    image: ot-ics-lab/openplc:v3-pinned     # local tag only; never pushed
    container_name: otlab-openplc
    restart: unless-stopped
    networks:
      ot_zone:
        ipv4_address: 172.18.0.2
      mgmt_zone:
        ipv4_address: 172.19.0.2
    ports:
      # KNOWN GOTCHA — OpenPLC exposes TWO DIFFERENT ports:
      #
      #   8080  OpenPLC WEB EDITOR / management UI (human, browser)
      #         WSL2: open http://localhost:8080 in the *Windows* browser.
      - "8080:8080"
      #
      #   502   Modbus/TCP server (machine). FUXA talks to this.
      #         Published to host ONLY so Wireshark / a Modbus client on
      #         Windows can reach it. Container-to-container Modbus does NOT
      #         use this published port (see the fuxa service note below).
      - "502:502"
    volumes:
      # OpenPLC v3 state is intermixed with code in webserver/ (DB, uploaded
      # ST files, active program selection, "Auto-start PLC" flag). A named
      # volume at the whole webserver/ dir captures the image's seeded content
      # on first `up` and persists user state across container recreation.
      # Asymmetric to FUXA's bind mount on appdata/ (FUXA's persistence dir is
      # clean; OpenPLC's isn't) — full rationale in docs/MASTER.md.
      #
      # GOTCHA: changing OPENPLC_COMMIT in plc/Dockerfile requires
      # `docker compose down -v` before the next --build, otherwise the volume
      # keeps the old commit's webserver code. README Troubleshooting documents.
      - openplc_state:/opt/OpenPLC_v3/webserver
    # Least-privilege (DELIBERATE — recruiter talking point): upstream's
    # sample run command uses --privileged for GPIO/hardware I/O. This lab
    # has no hardware, so privileged mode is intentionally NOT set. Rationale
    # repeated in README.md and docs/network-security.md.
    # VERIFY-ON-FIRST-RUN: if the runtime misbehaves without privileged, the
    # documented fallback lives in README.md (Troubleshooting).

  # ---------------------------------------------------------------------------
  # fuxa — the HMI. The screen an operator looks at. Talks Modbus/TCP to
  # OpenPLC and renders tank level / pump / valve / alarm.
  #
  # Phase 2 step 3a — IPs pinned (ipv4_address) so Suricata's $FUXA_IP
  # variable resolves to a stable address across restarts.
  # ---------------------------------------------------------------------------
  fuxa:
    image: frangoteam/fuxa:1.3.1            # verified real tag; no moving "latest"
    container_name: otlab-fuxa
    restart: unless-stopped
    depends_on:
      - openplc
    networks:
      ot_zone:
        ipv4_address: 172.18.0.3
      mgmt_zone:
        ipv4_address: 172.19.0.3
    ports:
      #   1881  FUXA HMI web UI (human, browser)
      #         WSL2: open http://localhost:1881 in the *Windows* browser.
      - "1881:1881"
    volumes:
      # KNOWN GOTCHA (the #1 first-time FUXA failure): without this bind mount
      # FUXA stores its project inside the container and the ENTIRE HMI SCREEN
      # is LOST on container recreation. This persists it to ./fuxa/appdata.
      # /usr/src/app/FUXA/server/_appdata is FUXA's documented data directory.
      - ./fuxa/appdata:/usr/src/app/FUXA/server/_appdata
    # KNOWN GOTCHA — FUXA -> OpenPLC Modbus link:
    # Inside the FUXA web UI, the Modbus device host MUST be the service name
    #   openplc   on port   502   — NOT localhost, NOT 127.0.0.1.
    # Containers reach each other by service name on a shared network
    # (ot_zone). "localhost" inside the FUXA container is FUXA itself. This
    # is the most common first-time failure; step-by-step fix in README.md.

  # ---------------------------------------------------------------------------
  # attacker — Phase 2. Sits on attacker_zone ONLY, by design.
  # Exists to PROVE segmentation: from here, openplc on ot_zone is not
  # reachable. That failure IS the first Phase 2 finding. Later scenarios
  # will intentionally cross the boundary; not in this task.
  # Built from a small pinned debian base (see attacker/Dockerfile for the
  # supply-chain rationale — same spirit as plc/Dockerfile).
  # Does NOT auto-run anything. `sleep infinity` keeps it alive; reach it
  # via:  docker exec -it otlab-attacker bash
  # ---------------------------------------------------------------------------
  attacker:
    build:
      context: ./attacker
      dockerfile: Dockerfile
    image: ot-ics-lab/attacker:phase2-pinned   # local tag only; never pushed
    container_name: otlab-attacker
    restart: unless-stopped
    networks:
      - attacker_zone     # ONLY. No route to ot_zone — that is the point.
    # No published ports: reached via `docker exec`, not from the host browser.
    # No volumes: stateless; tools rebuild from the pinned Dockerfile.

  # ---------------------------------------------------------------------------
  # suricata — Phase 2 step 3a. Passive IDS sensor.
  #
  # Multi-homed on ot_zone + mgmt_zone (per Phase 2 Finding §2 — legitimate
  # FUXA↔OpenPLC poll rides mgmt_zone; attacker traffic from a boundary-
  # crossed attacker rides ot_zone; sensor needs both).
  #
  # IDS mode (alert only, no drops). Live-capture via af-packet on eth0/eth1.
  # Docker bridge MAC-learning limits what a passive sensor sees live (it
  # gets broadcasts + own traffic only); for sub-session 3a this is fine —
  # the verification mechanism is offline pcap replay via
  #   docker exec otlab-suricata suricata -r /captures/<file>.pcap ...
  # Sub-sessions 3b and 3c will revisit live-capture if needed.
  #
  # mem_limit: 512m — hard cap to prevent OOM-kill of Phase 1 services on
  # WSL2 (documented gotcha). Suricata memcaps in suricata.yaml are sized
  # conservatively (16+32+16 = 64MB total) to fit comfortably under this.
  # ---------------------------------------------------------------------------
  suricata:
    image: jasonish/suricata:8.0.5
    container_name: otlab-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    mem_limit: 512m
    networks:
      ot_zone:
        ipv4_address: 172.18.0.4
      mgmt_zone:
        ipv4_address: 172.19.0.4
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/etc/suricata/rules:ro
      - ./suricata/logs:/var/log/suricata
      - ./captures:/captures:ro
    command:
      - "-c"
      - "/etc/suricata/suricata.yaml"
      - "-i"
      - "eth0"
      - "-i"
      - "eth1"

# -----------------------------------------------------------------------------
# Networks — explicit zoning. This segmentation IS the point of the lab.
# Honest scope note (expanded in docs/network-security.md): in Phase 1 both
# legitimate services are multi-homed on ot_zone + mgmt_zone for usability.
# The real, demonstrable enforcement boundary is attacker_zone, which is an
# isolated bridge with no route to ot_zone.
#
# Phase 2 step 3a — subnets + gateways pinned via ipam.config so the
# ipv4_address assignments above take effect deterministically.
# -----------------------------------------------------------------------------
networks:
  ot_zone:
    name: otlab_ot_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    # "Plant floor" / process network. Modbus/TCP between HMI and PLC.

  mgmt_zone:
    name: otlab_mgmt_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
    # "Engineering / management" network. Human web access to the UIs.

  attacker_zone:
    name: otlab_attacker_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    # Phase 2: the `attacker` service is the sole occupant. Docker bridge
    # networks are isolated from each other by default, so a container
    # placed ONLY here cannot reach ot_zone — that is the enforcement
    # boundary this lab demonstrates. Full rationale in docs/MASTER.md.

# -----------------------------------------------------------------------------
# Volumes — Docker-managed persistence for OpenPLC state. Named volume (not a
# bind mount) because OpenPLC's state lives intermixed with code in webserver/,
# so first-up needs Docker's "seed empty volume with image contents" semantics
# rather than the FUXA-style empty-host-dir bind mount.
# -----------------------------------------------------------------------------
volumes:
  openplc_state:
    name: otlab_openplc_state
