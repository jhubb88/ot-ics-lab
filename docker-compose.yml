# =============================================================================
# OT/ICS Security Lab — Phase 1 + Phase 2
# 3 services (Phase 1) + 1 attacker (step 1) + 1 Suricata sensor (step 3a).
# 3 networks. Static IPs pinned for openplc + fuxa so the IDS ruleset has
# stable reference addresses.
#
# No top-level `version:` key on purpose — Docker Compose v2 deprecated it.
# WSL2 + Docker Desktop reminder (full detail in README.md):
#   - From the WINDOWS browser:        use  http://localhost:<port>
#   - Container talking to container:  use the SERVICE NAME, never localhost
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # openplc_v4 — the PLC. OpenPLC Runtime v4 from the Autonomy-Logic fork
  # (replaced v3 in Phase 3 migration, completed 2026-05-26). Image lives on
  # GHCR, NOT Docker Hub. Pinned to v4.0.9 — the last MatIEC-accepting final
  # release. See docs/decisions/0001-phase3-stack.md (Gate 2 decision) +
  # Corrections forward, and MASTER.md §15-§23 (Phase 3 Findings).
  #
  # Why v4.0.9 and not v4.1.x: Editor v4.1.x produces MatIEC output that
  # v4.1.x Runtime rejects (it ships an unannounced STruC++ pipeline). v4.0.9
  # is the last functional Editor↔Runtime combination. Upstream issue:
  # github.com/Autonomy-Logic/openplc-editor/issues/782.
  #
  # No web UI on this runtime — port 8443 is REST API (HTTPS, JWT-auth).
  # Pointing a browser at https://localhost:8443 shows nothing useful;
  # connect via the OpenPLC Editor v4 desktop app instead.
  # ---------------------------------------------------------------------------
  openplc_v4:
    image: ghcr.io/autonomy-logic/openplc-runtime:v4.0.9
    container_name: otlab-openplc-v4
    restart: unless-stopped
    cap_add:
      # Per upstream docs/DOCKER.md — runtime needs these for scheduling.
      - SYS_NICE
      - SYS_RESOURCE
    networks:
      ot_zone:
        ipv4_address: 172.18.0.5
      # mgmt_zone attachment is intentionally deferred to Stop 4 (FUXA
      # cutover), when the IP planning matters for the legitimate poll path.
    ports:
      #   8443  v4 REST API (HTTPS, JWT-auth). Published so the OpenPLC
      #         Editor desktop app (Windows) can reach it. NOT a web UI.
      - "8443:8443"
      # Port 502 deliberately NOT published — v3 still owns host:502 during
      # the migration. v4's Modbus (once Stop 2 enables it) is reachable
      # only from inside the ot_zone bridge at 172.18.0.5:502.
    volumes:
      # State persistence per upstream docs/DOCKER.md.
      # /var/run/runtime contains: .env (JWT secret + DB URI), restapi.db
      # (user accounts SQLite), runtime socket files.
      - openplc_v4_state:/var/run/runtime
      # plugins.conf — declares the modbus_slave plugin. Read-only mount;
      # authored on the host so it survives `docker compose down -v`.
      # File format documented inside the file. Plugin config schema and
      # the actual mounted-to path documented in MASTER.md §14 follow-up.
      - ./plc/v4/plugins.conf:/workdir/plugins.conf:ro
      # modbus_slave plugin config — overrides the plugin's default port
      # 5020 to the standard Modbus port 502. Bound at /workdir/ because
      # the path in plugins.conf column 5 (./modbus_slave_config.json) is
      # resolved relative to the runtime's CWD which is /workdir.
      - ./plc/v4/modbus_slave_config.json:/workdir/modbus_slave_config.json:ro

  # ---------------------------------------------------------------------------
  # fuxa — the HMI. The screen an operator looks at. Talks Modbus/TCP to
  # OpenPLC and renders tank level / pump / valve / alarm.
  #
  # Phase 2 step 3a — IPs pinned (ipv4_address) so Suricata's $FUXA_IP
  # variable resolves to a stable address across restarts.
  # ---------------------------------------------------------------------------
  fuxa:
    image: frangoteam/fuxa:1.3.1            # Pinned at 1.3.1 deliberately. 1.3.2 attempted during Phase 3 Stop 4 — plugin-architecture change broke pre-1.3.2 project DBs (MASTER.md §21). DB connection target is openplc_v4:502.
    container_name: otlab-fuxa
    restart: unless-stopped
    depends_on:
      - openplc_v4
    networks:
      ot_zone:
        ipv4_address: 172.18.0.3
      mgmt_zone:
        ipv4_address: 172.19.0.3
    ports:
      #   1881  FUXA HMI web UI (human, browser)
      #         WSL2: open http://localhost:1881 in the *Windows* browser.
      - "1881:1881"
    volumes:
      # KNOWN GOTCHA (the #1 first-time FUXA failure): without this bind mount
      # FUXA stores its project inside the container and the ENTIRE HMI SCREEN
      # is LOST on container recreation. This persists it to ./fuxa/appdata.
      # /usr/src/app/FUXA/server/_appdata is FUXA's documented data directory.
      - ./fuxa/appdata:/usr/src/app/FUXA/server/_appdata
    # KNOWN GOTCHA — FUXA -> openplc_v4 Modbus link:
    # Inside the FUXA web UI, the Modbus device host MUST be the service name
    #   openplc_v4   on port   502   — NOT localhost, NOT 127.0.0.1.
    # Containers reach each other by service name on a shared network
    # (ot_zone). "localhost" inside the FUXA container is FUXA itself.
    # Connection target is persisted in fuxa/appdata/project.fuxap.db.
    #
    # Healthcheck — detect silent Modbus client drops. FUXA's ModbusTCP
    # driver has no auto-reconnect (Phase 2 Finding §10, ecosystem-wide
    # per Gate 2 ADR research). When the connection silently dies the HMI
    # freezes without logging. Probe: /proc/net/tcp inside the container for
    # an ESTABLISHED conn (state 01) to the Modbus target on port 502.
    #   050012AC:01F6 = 172.18.0.5:502 (openplc_v4 on ot_zone)
    # On unhealthy: `docker compose up -d --force-recreate fuxa`.
    # FUXA→openplc routing rides ot_zone exclusively now (MASTER.md §22);
    # was mgmt_zone in the v3 era per Phase 2 Finding §2.
    healthcheck:
      test: ["CMD-SHELL", "awk '$4==\"01\" && $3==\"050012AC:01F6\"' /proc/net/tcp | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------------------
  # attacker — Phase 2. Sits on attacker_zone ONLY, by design.
  # Exists to PROVE segmentation: from here, openplc on ot_zone is not
  # reachable. That failure IS the first Phase 2 finding. Later scenarios
  # will intentionally cross the boundary; not in this task.
  # Built from a small pinned debian base (see attacker/Dockerfile for the
  # supply-chain rationale — same spirit as plc/Dockerfile).
  # Does NOT auto-run anything. `sleep infinity` keeps it alive; reach it
  # via:  docker exec -it otlab-attacker bash
  # ---------------------------------------------------------------------------
  attacker:
    build:
      context: ./attacker
      dockerfile: Dockerfile
    image: ot-ics-lab/attacker:phase2-pinned   # local tag only; never pushed
    container_name: otlab-attacker
    restart: unless-stopped
    networks:
      - attacker_zone     # ONLY. No route to ot_zone — that is the point.
    # No published ports: reached via `docker exec`, not from the host browser.
    # No volumes: stateless; tools rebuild from the pinned Dockerfile.

  # ---------------------------------------------------------------------------
  # suricata — Phase 2 step 3a. Passive IDS sensor.
  #
  # Multi-homed on ot_zone + mgmt_zone (per Phase 2 Finding §2 — legitimate
  # FUXA↔OpenPLC poll rides mgmt_zone; attacker traffic from a boundary-
  # crossed attacker rides ot_zone; sensor needs both).
  #
  # IDS mode (alert only, no drops). Live-capture via af-packet on eth0/eth1.
  # Docker bridge MAC-learning limits what a passive sensor sees live (it
  # gets broadcasts + own traffic only); for sub-session 3a this is fine —
  # the verification mechanism is offline pcap replay via
  #   docker exec otlab-suricata suricata -r /captures/<file>.pcap ...
  # Sub-sessions 3b and 3c will revisit live-capture if needed.
  #
  # mem_limit: 512m — hard cap to prevent OOM-kill of Phase 1 services on
  # WSL2 (documented gotcha). Suricata memcaps in suricata.yaml are sized
  # conservatively (16+32+16 = 64MB total) to fit comfortably under this.
  # ---------------------------------------------------------------------------
  suricata:
    image: jasonish/suricata:8.0.5
    container_name: otlab-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    mem_limit: 512m
    networks:
      ot_zone:
        ipv4_address: 172.18.0.4
      mgmt_zone:
        ipv4_address: 172.19.0.4
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/etc/suricata/rules:ro
      - ./suricata/logs:/var/log/suricata
      - ./captures:/captures:ro
    command:
      - "-c"
      - "/etc/suricata/suricata.yaml"
      - "-i"
      - "eth0"
      - "-i"
      - "eth1"

  # ---------------------------------------------------------------------------
  # influxdb — Queue Item 1. The historian — time-series store for PLC metrics.
  # Per ADR 0002 (docs/decisions/0002-historian-stack.md), pinned to v2.9.1
  # explicitly. Docker Hub's `influxdb:latest` tag began pointing at v3 Core
  # on 2026-05-27 (the day of the ADR). v3 is a different product (Apache
  # Arrow storage, no Flux, 72-hour query cap). DO NOT change this pin
  # without an ADR amendment.
  #
  # Initial setup runs once on first start, driven by DOCKER_INFLUXDB_INIT_*
  # vars. The image's entrypoint script reads them on a cold start of
  # /var/lib/influxdb2 only — changes to .env after first start have NO
  # effect on a running InfluxDB. To re-run setup, delete the
  # otlab_influxdb_data volume.
  #
  # mgmt_zone only — InfluxDB must not be reachable from ot_zone. Only
  # Telegraf bridges the two zones (per ADR 0002 network plan).
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.9.1
    container_name: otlab-influxdb
    restart: unless-stopped
    environment:
      # First-run setup mode. After volume is populated, subsequent starts
      # ignore the rest of these vars.
      DOCKER_INFLUXDB_INIT_MODE: setup
      # Maps .env's INFLUXDB_INIT_* (Option A: keep .env clean of DOCKER_
      # prefix; translate here, where it belongs) -> the env-var names the
      # image's entrypoint actually expects.
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_INIT_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    networks:
      - mgmt_zone
    ports:
      #   8086  InfluxDB v2 HTTP API + web UI. WSL2: http://localhost:8086
      #         from the WINDOWS browser.
      - "8086:8086"
    volumes:
      # Time-series data + WAL + metadata. Bulk of disk usage lives here.
      - influxdb_data:/var/lib/influxdb2
      # CLI configs / operator profile. Small, but separate per upstream
      # convention so re-init of /var/lib doesn't wipe the operator config.
      - influxdb_config:/etc/influxdb2
    healthcheck:
      # `influx ping` is in the image, needs no auth, returns 0 when the
      # HTTP API is up. Used by Telegraf's depends_on: service_healthy to
      # wait through the one-shot setup phase before its first write.
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # telegraf — Queue Item 1. The collector. Reads OpenPLC v4 over Modbus TCP
  # and writes line-protocol metrics to InfluxDB. Per ADR 0002, pinned to
  # 1.38.4-alpine. Configuration lives in ./telegraf/telegraf.conf, bind-
  # mounted :ro so Telegraf cannot rewrite its own config (matches the
  # load-bearing :ro pattern from MASTER.md §20 for plugins.conf).
  #
  # Multi-homed on ot_zone + mgmt_zone — the deliberate IT/OT bridge pattern
  # from ADR 0002. Telegraf reads the PLC on ot_zone and writes to InfluxDB
  # on mgmt_zone. Future Suricata rules targeting the bridge traffic will
  # key on this exact placement.
  #
  # depends_on InfluxDB with condition: service_healthy so Telegraf waits
  # for the one-shot initial setup to complete before its first write
  # attempt. Without this gate, Telegraf's first batch lands while InfluxDB
  # is still mid-setup and the bucket / token / org don't exist yet.
  # ---------------------------------------------------------------------------
  telegraf:
    image: telegraf:1.38.4-alpine
    container_name: otlab-telegraf
    restart: unless-stopped
    # Defense in depth: inject ONLY the three vars Telegraf needs to write
    # to InfluxDB. Avoids leaking GRAFANA_ADMIN_PASSWORD, INFLUXDB_INIT_
    # USERNAME, INFLUXDB_INIT_PASSWORD, etc. into this container's env
    # (which env_file: .env would have done).
    environment:
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - ot_zone
      - mgmt_zone
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      # `pgrep telegraf` succeeds as long as the daemon is alive. Cheap
      # liveness probe — does NOT verify Modbus polls are working. For
      # that, check `docker logs otlab-telegraf` directly.
      test: ["CMD-SHELL", "pgrep telegraf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # grafana — Queue Item 1. Visualization layer. Per ADR 0002, pinned to
  # 13.0.1-security-01 (security-patched release of 13.0.1). DO NOT use
  # :latest — Grafana's `latest` tag has historically moved between major
  # versions without warning.
  #
  # Admin creds set from .env on first start. Subsequent changes to .env
  # do NOT update an existing admin user — change the password via the
  # Grafana UI / API after first start, or delete the otlab_grafana_data
  # volume to re-run the first-start path.
  #
  # mgmt_zone only. Browser access via http://localhost:3000 — the
  # published port goes to the WINDOWS host (WSL2 + Docker Desktop).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: otlab-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Defense in depth: inject ONLY the three InfluxDB vars Grafana's
      # provisioning needs. Avoids leaking GRAFANA_ADMIN_PASSWORD or the
      # InfluxDB INIT_USERNAME / INIT_PASSWORD into this container. Read by
      # grafana/provisioning/datasources/influxdb.yml via ${VAR} expansion.
      INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    networks:
      - mgmt_zone
    ports:
      #   3000  Grafana web UI. WSL2: http://localhost:3000 from the
      #         WINDOWS browser.
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource provisioning. :ro per the load-bearing pattern — Grafana
      # cannot rewrite its own provisioning. UI edits to provisioned
      # datasources are overwritten on next container start.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    healthcheck:
      # /api/health is Grafana's documented healthcheck endpoint and
      # needs no auth. wget --spider checks status only, no body download.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# -----------------------------------------------------------------------------
# Networks — explicit zoning. This segmentation IS the point of the lab.
# Honest scope note (expanded in docs/network-security.md): in Phase 1 both
# legitimate services are multi-homed on ot_zone + mgmt_zone for usability.
# The real, demonstrable enforcement boundary is attacker_zone, which is an
# isolated bridge with no route to ot_zone.
#
# Phase 2 step 3a — subnets + gateways pinned via ipam.config so the
# ipv4_address assignments above take effect deterministically.
# -----------------------------------------------------------------------------
networks:
  ot_zone:
    name: otlab_ot_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    # "Plant floor" / process network. Modbus/TCP between HMI and PLC.

  mgmt_zone:
    name: otlab_mgmt_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
    # "Engineering / management" network. Human web access to the UIs.

  attacker_zone:
    name: otlab_attacker_zone
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    # Phase 2: the `attacker` service is the sole occupant. Docker bridge
    # networks are isolated from each other by default, so a container
    # placed ONLY here cannot reach ot_zone — that is the enforcement
    # boundary this lab demonstrates. Full rationale in docs/MASTER.md.

# -----------------------------------------------------------------------------
# Volumes — Docker-managed persistence. Named volumes survive
# `docker compose down`; lose contents only on `docker compose down -v`.
#   openplc_v4_state  — /var/run/runtime in OpenPLC: JWT secret + DB URI
#                       (.env), restapi.db (user accounts), runtime sockets.
#   influxdb_data     — /var/lib/influxdb2: time-series data + WAL + metadata.
#   influxdb_config   — /etc/influxdb2: CLI configs + operator profile.
#   grafana_data      — /var/lib/grafana: dashboards, users, datasources,
#                       sessions (SQLite-backed).
# -----------------------------------------------------------------------------
volumes:
  openplc_v4_state:
    name: otlab_openplc_v4_state
  influxdb_data:
    name: otlab_influxdb_data
  influxdb_config:
    name: otlab_influxdb_config
  grafana_data:
    name: otlab_grafana_data
