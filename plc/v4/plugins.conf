# OpenPLC Runtime v4 plugin configuration — loaded from /workdir/plugins.conf
# by plc_main.c:110 (initial load) and plc_state_manager.c:254 (reload).
#
# Format (parsed by core/src/drivers/plugin_config.c:42):
#   name,path,enabled,type,plugin_related_config_path,venv_path
#
# Fields:
#   name      — plugin identifier
#   path      — plugin source file, relative to /workdir
#   enabled   — 1 = active, 0 = present but ignored
#   type      — 0 = Python plugin, 1 = native C/C++ plugin
#   plugin_related_config_path — optional plugin-specific config (JSON)
#   venv_path — optional Python virtual env for the plugin
#
# Lab note: modbus_slave's default port is 5020 (per simple_modbus.py:983).
# modbus_slave_config.json overrides to host=0.0.0.0 port=502.
modbus_slave,./core/src/drivers/plugins/python/modbus_slave/simple_modbus.py,1,0,./modbus_slave_config.json,./venvs/modbus_slave
